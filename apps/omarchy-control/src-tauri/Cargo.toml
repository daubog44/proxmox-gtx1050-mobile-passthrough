[package]
name = "omarchy-control"
version = "0.4.0"
description = "Cross-platform control plane for an Omarchy remote desktop"
authors = ["Omarchy setup"]
edition = "2021"
build = "build.rs"

[lib]
name = "omarchy_control_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "omarchy-control"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
aes-gcm = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
getrandom = "0.2"
ureq = { version = "2.9", features = ["json"] }
base64 = "0.22"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
