[package]
name = "omarchy-control"
version = "0.2.6"
description = "Cross-platform control plane for an Omarchy remote desktop"
authors = ["Omarchy setup"]
edition = "2021"
build = "build.rs"

[lib]
name = "omarchy_control_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "omarchy-control"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
