name: Omarchy Control release

on:
  push:
    tags:
      - "omarchy-control-v*"

permissions:
  contents: write

jobs:
  desktop-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            targets: ""
            args: --bundles rpm
          - platform: windows-latest
            targets: ""
            args: --bundles nsis
          - platform: macos-latest
            targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - platform: macos-latest
            targets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/omarchy-control/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Install Tauri Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            rpm

      - name: Install frontend dependencies
        working-directory: apps/omarchy-control
        run: npm ci

      - name: Validate frontend
        working-directory: apps/omarchy-control
        run: npm run build

      - name: Run platform Rust tests
        working-directory: apps/omarchy-control/src-tauri
        run: cargo test --all-targets

      - name: Parse Windows client scripts
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem clients -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }

      - name: Parse shell client scripts
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: bash -n clients/omarchy-client-setup-fedora.sh clients/voxtype-fedora-mic-rtp.sh

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && '-' || '' }}
        with:
          projectPath: apps/omarchy-control
          tagName: ${{ github.ref_name }}
          releaseName: "Omarchy Control ${{ github.ref_name }}"
          releaseBody: |
            Desktop control plane for the Omarchy remote workstation.

            Native packages for Fedora, Windows, macOS Apple Silicon and macOS Intel.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          assetNamePattern: "omarchy-control-[version]-[platform]-[arch][setup][ext]"
