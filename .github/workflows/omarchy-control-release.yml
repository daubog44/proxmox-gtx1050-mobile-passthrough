name: Omarchy Control release

on:
  push:
    tags:
      - "omarchy-control-v*"

permissions:
  contents: write

jobs:
  fedora-rpm:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/omarchy-control/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            rpm

      - name: Install frontend dependencies
        working-directory: apps/omarchy-control
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/omarchy-control
          tagName: ${{ github.ref_name }}
          releaseName: "Omarchy Control ${{ github.ref_name }}"
          releaseBody: |
            Desktop control plane for the Omarchy remote workstation.

            Fedora: download the RPM, install it with DNF, then launch `omarchy-control`.
          releaseDraft: false
          prerelease: false
          args: --bundles rpm
          assetNamePattern: "omarchy-control-[version]-[arch].[ext]"
